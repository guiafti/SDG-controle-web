name: Publish Update

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish
        env:
          # Token com permissão 'repo' e 'workflow'
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        # Força o electron-builder a publicar no repo público independente de onde o código está
        run: |
          $env:PUBLISH_FORCED = "true"
          npm run dist -- --publish always -c.publish.provider=github -c.publish.owner=Marcelaun -c.publish.repo=sdg-releases
